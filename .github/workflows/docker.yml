name: Docker image

# Builds the API image (see docs/API.md), proves it boots, and pushes it to the GitHub
# Container Registry as
#   ghcr.io/<owner>/laya:latest
#   ghcr.io/<owner>/laya:<commit sha>
# Nothing to configure: GITHUB_TOKEN publishes to ghcr.io of the repository that runs this.
# For Docker Hub instead, set REGISTRY to docker.io, use <user>/laya as the image name, and
# log in with secrets.DOCKERHUB_USERNAME / secrets.DOCKERHUB_TOKEN.
#
# A new package is private; make it public under the repository's Packages settings if anyone
# should be able to pull it without a token.

on:
  push:
    branches: [main]
  pull_request:
    # On a pull request the image is built and tested but never pushed, so a broken Dockerfile
    # is caught before main. Only when something that goes into the image changed.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "laya/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        # Registries reject uppercase, and an owner or a fork may well have some.
        run: echo "name=$REGISTRY/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                    # into the runner's docker, for the smoke test below
          tags: laya-api:ci
          # torch is the slow half of the build; reuse it across runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        # Lazy loading, so this starts in seconds and downloads no checkpoints: it proves the
        # image boots, serves, routes, and carries the spec the Swagger page renders.
        run: |
          docker run -d --name laya-smoke -p 8000:8000 laya-api:ci
          for _ in $(seq 1 30); do curl -sf localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf localhost:8000/health || { docker logs laya-smoke; exit 1; }
          curl -sf localhost:8000/openapi.json | grep -q '"/v1/predict"'
          curl -sf -X POST localhost:8000/v1/route -H 'content-type: application/json' \
            -d '{"state":{"body":"मुझसे दो बार शुल्क लिया गया"}}' | grep -q multilingual
          docker rm -f laya-smoke

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push :latest and :<commit sha>
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        # Every layer is already in the cache from the Build step, so this only uploads.
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
